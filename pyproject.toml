[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "victorian-home-data"
version = "0.1.0"
description = "Medallion data platform for Victorian home investment research"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyarrow>=17,<20",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
azure = [
  "azure-identity>=1.17,<2",
  "azure-keyvault-secrets>=4.9,<5",
  "azure-storage-blob>=12.22,<13",
  "pyodbc>=5.1,<6",
]
free-cloud = [
  "boto3>=1.35,<2",
  "psycopg[binary]>=3.2,<4",
  "streamlit>=1.40,<2",
]

[project.scripts]
home-data = "home_data.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/home_data"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["work", "outputs", ".venv", "data"]
